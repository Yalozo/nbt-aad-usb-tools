name: Android application
on:
  push:
    paths:
      - 'android-prototype/**'
      - 'nbt-aad.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-prototype/**'
      - 'nbt-aad.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Build and test Android application
        run: gradle -p android-prototype --no-daemon assembleRelease testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: NBT-AAD-Android-unsigned
          path: android-prototype/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
