name: Publish desktop release
on:
  workflow_run:
    workflows: ['Windows application', 'macOS application']
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: desktop-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, head_sha: sha, per_page: 100});
            const selected = {};
            for (const name of ['Windows application', 'macOS application', 'Checks']) {
              const run = runs.find(r => r.name === name && r.event === 'push' &&
                r.head_branch === 'main' && r.status === 'completed' && r.conclusion === 'success');
              if (!run) { core.info('Waiting for successful ' + name + ' at ' + sha); return; }
              selected[name] = run;
            }
            const source = await github.rest.repos.getContent({owner, repo, ref: sha,
              path: 'windows/nbt_aad_pc/__init__.py'});
            const match = Buffer.from(source.data.content, 'base64').toString('utf8')
              .match(/__version__ = '([0-9]+\.[0-9]+\.[0-9]+)'/);
            if (!match) throw new Error('Cannot read application version');
            const version = match[1], tag = 'app-v' + version;
            const artifacts = [];
            for (const name of ['Windows application', 'macOS application']) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({owner, repo,
                run_id: selected[name].id, per_page: 100});
              artifacts.push(...response.data.artifacts);
            }
            const names = ['NBT-AAD-PC-Windows-x64', 'NBT-AAD-PC-macOS-arm64', 'NBT-AAD-PC-macOS-x86_64'];
            const packages = names.map(name => {
              const matches = artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length !== 1) throw new Error('Missing/ambiguous artifact: ' + name);
              return matches[0];
            });
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (release && release.target_commitish !== sha) {
              throw new Error('This version was already released from a different commit; bump its version.');
            }
            if (release && !release.draft) { core.info('Release already published: ' + release.html_url); return; }
            if (!release) {
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag,
                target_commitish: sha, name: 'NBT-AAD PC ' + version + ' — Windows / macOS',
                draft: true, prerelease: false,
                body: '## Русский\n\n' +
                  'Бесплатный установщик беспроводного Android Auto для BMW и MINI с NBT Evo. ' +
                  'Выберите язык в правом верхнем углу. Путь к журналу и кнопка отправки остаются видимыми при уменьшении окна.\n\n' +
                  'В журнале теперь видны VIN автомобиля из ответа шлюза, VIN из ответа ГУ и версия прошивки NBT Evo после входа по SSH. ' +
                  'При ретрофите VIN автомобиля и ГУ могут отличаться. Кнопка отправки прикладывает журнал вместе с VIN.\n\n' +
                  'Перед открытием SSH программа проверяет, отвечает ли само ГУ по диагностике. ' +
                  'Если отвечает только шлюз, программа остановится и подскажет проверить Ethernet/OABR при ретрофите.\n\n' +
                  'Подключите ENET и включите зажигание. Если SSH закрыт, для автоматического открытия нужен стабильный интернет.\n\n' +
                  'Распакуйте архив и запустите EXE на Windows. На macOS распакуйте также вложенный ZIP и перенесите .app в «Программы». ' +
                  'Инструкции по первому запуску сборки Mac с ad-hoc подписью приведены ниже.\n\n' +
                  '[Windows](https://github.com/' + owner + '/' + repo + '/blob/main/windows/README.md) · ' +
                  '[macOS](https://github.com/' + owner + '/' + repo + '/blob/main/macos/README.md) · ' +
                  '[Drive2](https://www.drive2.ru/l/747198416496362487/)\n\n' +
                  '## English\n\n' +
                  'Free wireless Android Auto installer for BMW and MINI with NBT Evo. ' +
                  'Choose the language at the top right. The log path and Send Log stay visible when the window shrinks.\n\n' +
                  'The log now records the vehicle VIN from the gateway, the VIN from the head unit reply, and the NBT Evo firmware version after SSH login. ' +
                  'A retrofitted head unit may have a different VIN. Send Log attaches the log with these entries.\n\n' +
                  'Before requesting SSH activation, the app checks for a diagnostic reply from the head unit. ' +
                  'If only the gateway responds, the app stops and prompts retrofit owners to check Ethernet/OABR.\n\n' +
                  'Connect ENET and turn on the ignition. A stable internet connection is required to open SSH automatically if it is closed.\n\n' +
                  'Extract the archive and run the EXE on Windows. On macOS, also extract the nested ZIP and move the .app to Applications. ' +
                  'See the first-launch instructions for the ad-hoc-signed Mac build.\n\n' +
                  '[Windows](https://github.com/' + owner + '/' + repo + '/blob/main/windows/README.en.md) · ' +
                  '[macOS](https://github.com/' + owner + '/' + repo + '/blob/main/macos/README.en.md)\n\n' +
                  'NBT-AAD загружается из исходного проекта. / NBT-AAD is downloaded from the upstream project.'})).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data;
            for (const artifact of packages) {
              const name = artifact.name + '-v' + version + '.zip';
              if (existing.some(a => a.name === name)) continue;
              const response = await github.rest.actions.downloadArtifact({owner, repo,
                artifact_id: artifact.id, archive_format: 'zip'});
              const data = Buffer.from(response.data);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
                name, data, headers: {'content-type': 'application/zip', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id,
              draft: false, make_latest: 'true'});
            core.info('Published ' + tag);
